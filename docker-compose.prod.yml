# Production stack for the VPS. Read deploy/DEPLOY.md before first use.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Migrations never run automatically (rule R0). The operator runs:
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm web python manage.py migrate

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  MEDIA_ROOT: /data/media
  PRIVATE_MEDIA_ROOT: /data/private
  TZ: Asia/Bangkok

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      REQUIREMENTS: requirements/base.txt
  image: lucid-app:latest
  restart: unless-stopped
  env_file: .env.production
  environment:
    <<: *app-env
  volumes:
    - media:/data/media
    - private:/data/private
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Bangkok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    environment:
      <<: *app-env
      DJANGO_COLLECTSTATIC: "1"
    volumes:
      - media:/data/media
      - private:/data/private
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "docker/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]

  beat:
    <<: *app
    # The schedule lives in settings (CELERY_BEAT_SCHEDULE); only run state is kept in /tmp.
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/reload-loop.sh:/docker-entrypoint.d/99-reload-loop.sh:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
      - certs:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/renew-loop.sh"]
    volumes:
      - ./docker/nginx/renew-loop.sh:/renew-loop.sh:ro
      - certs:/etc/letsencrypt
      - acme:/var/www/certbot

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_HOUR: "03"
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Bangkok
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    volumes:
      - ./docker/backup:/backup:ro
      - ./backups:/backups
      - media:/data/media:ro
      - private:/data/private:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
  private:
  static:
  certs:
  acme:
