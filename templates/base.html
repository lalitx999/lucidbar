{% load static i18n %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="{% block meta_description %}{% translate "Exclusive members portal of Lucid Society." %}{% endblock %}">
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>

  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/pwa/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/pwa/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/pwa/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% url 'core:manifest' %}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lucid">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/lucid.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}" defer></script>
  <script src="{% static 'js/pwa.js' %}" data-sw="{% url 'core:service_worker' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
